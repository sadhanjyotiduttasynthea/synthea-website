# Builds the static site and publishes it to the `hostinger-deploy` branch.
# Hostinger (hPanel → Advanced → Git) deploys that branch into public_html,
# with Auto Deployment triggered by a webhook on every update.
name: Build & publish for Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://syntheatech.com

      - name: Check the export
        run: |
          test -f out/index.html
          test -f out/.htaccess
          test -f out/api/contact.php
          test ! -f out/api/contact-config.php

      - name: Publish to hostinger-deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: hostinger-deploy
          force_orphan: true
          enable_jekyll: true # do not add a .nojekyll file
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Deploy ${{ github.sha }}
